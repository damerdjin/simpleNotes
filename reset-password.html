<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <title>Réinitialiser le mot de passe - Gestion des Corrections</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/translations.js"></script>
    <style>
        .notification-toast {
            transition: all 0.3s ease-in-out;
            opacity: 0;
            transform: translateY(-10px);
        }
        .notification-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center relative">
    <div class="bg-white p-8 rounded shadow-md w-full max-w-md relative">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600" data-translate="changePasswordTitle">Réinitialiser le mot de passe</h2>

        <!-- Language Selector -->
        <div class="mb-4 flex justify-center">
            <select id="language-selector" class="bg-gray-50 border border-gray-300 text-gray-700 py-1 px-2 rounded focus:outline-none focus:shadow-outline text-sm">
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </div>

        <div id="notification-area" class="mb-4 hidden"></div>
        <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

        <form id="reset-password-form">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="new-password" data-translate="newPassword">
                    Nouveau mot de passe
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    id="new-password" type="password" placeholder="Min. 6 caractères" data-translate-placeholder="newPasswordPlaceholder" required minlength="6">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="confirm-password" data-translate="confirmPassword">
                    Confirmer le mot de passe
                </label>
                <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                    id="confirm-password" type="password" placeholder="Retapez le mot de passe" data-translate-placeholder="confirmPasswordPlaceholder" required minlength="6">
            </div>

            <div class="flex items-center justify-between">
                <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full" 
                    type="submit" id="submit-btn" data-translate="save">
                    Enregistrer le nouveau mot de passe
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { supabase } from './src/ui/supabase-client.js';
        import { initLanguage, changeLanguage, t } from './src/ui/i18n.js';

        // Initialize language
        const currentLang = initLanguage();
        const langSelector = document.getElementById('language-selector');
        if (langSelector) {
            langSelector.value = currentLang;
            langSelector.addEventListener('change', (e) => {
                changeLanguage(e.target.value);
            });
        }

        const form = document.getElementById('reset-password-form');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const notificationArea = document.getElementById('notification-area');

        function showNotification(message, type = 'info') {
            const bgColor = type === 'error' ? 'bg-red-100' : 'bg-green-100';
            const borderColor = type === 'error' ? 'border-red-400' : 'border-green-400';
            const textColor = type === 'error' ? 'text-red-700' : 'text-green-700';

            notificationArea.className = `mb-4 px-4 py-3 rounded border ${bgColor} ${borderColor} ${textColor} notification-toast show`;
            notificationArea.textContent = message;
            notificationArea.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.add('hidden');
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = t('passwordsNotMatching') || 'Les mots de passe ne correspondent pas.';
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = t('loading') || 'Chargement...';

            try {
                const { error } = await supabase.auth.updateUser({ password: newPassword });
                
                if (error) throw error;

                showNotification(t('passwordModified') || 'Mot de passe modifié avec succès !', 'success');
                
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = t('save') || 'Enregistrer';
            }
        });

        // Basic check to see if we have a recovery token in the URL hash
        // Supabase typically handles the session automatically when landing from a recovery link
        const checkRecovery = async () => {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (!session) {
                // If no session, it might mean the link is expired or invalid
                // However, some flows might not have a session yet.
                // We'll let the update try and fail if needed.
            }
        };
        checkRecovery();
    </script>
</body>
</html>
