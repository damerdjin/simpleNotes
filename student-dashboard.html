<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Espace Élève - Mes Notes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/translations.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .grade-card {
            transition: transform 0.2s;
        }
        .grade-card:active {
            transform: scale(0.98);
        }
        
        /* Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #10b981;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased pb-10">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">Espace Élève</h1>
            <p class="text-sm text-emerald-100" id="student-name">Chargement...</p>
        </div>
        <button id="logout-btn" class="p-2 bg-emerald-700 rounded-full hover:bg-emerald-800 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-lg mx-auto">
        
        <!-- Summary Stats -->
        <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex justify-between items-center">
            <div>
                <p class="text-sm text-gray-500 font-medium">Moyenne Générale</p>
                <p class="text-2xl font-bold text-gray-800" id="average-display">--/20</p>
            </div>
            <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            </div>
        </div>

        <h2 class="text-lg font-bold text-gray-700 mb-4 px-1">Dernières Notes</h2>

        <!-- Loading State -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-10">
            <div class="loader mb-3"></div>
            <p class="text-gray-500 text-sm">Récupération de vos notes...</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="hidden bg-red-50 text-red-600 p-4 rounded-xl text-sm text-center border border-red-100">
            Impossible de charger les notes. Veuillez réessayer.
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-10 text-center">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-3 text-gray-400">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <p class="text-gray-600 font-medium">Aucune note disponible</p>
            <p class="text-gray-400 text-sm mt-1">Vos professeurs n'ont pas encore publié de notes pour vous.</p>
        </div>

        <!-- Grades List -->
        <div id="grades-list" class="space-y-3">
            <!-- Injected dynamically -->
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sessionStr = localStorage.getItem('student_session');
            if (!sessionStr) {
                window.location.href = '/login.html';
                return;
            }

            let session;
            try {
                session = JSON.parse(sessionStr);
            } catch(e) {
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('student-name').textContent = session.info.name + (session.info.className ? ` - ${session.info.className}` : '');

            document.getElementById('logout-btn').addEventListener('click', async () => {
                // Appeler l'API pour nettoyer le cookie sécurisé
                try {
                    await fetch('/api/student/logout', { method: 'POST' });
                } catch (e) {
                    console.error('Logout error', e);
                }
                // Nettoyer le stockage local
                localStorage.removeItem('student_session');
                window.location.href = '/login.html';
            });

            fetchGrades(session.token);
        });

        async function fetchGrades(token) {
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            const emptyState = document.getElementById('empty-state');
            const gradesList = document.getElementById('grades-list');
            const avgDisplay = document.getElementById('average-display');

            try {
                const res = await fetch('/api/student/grades', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem('student_session');
                    window.location.href = '/login.html';
                    return;
                }

                const data = await res.json();
                
                if (!res.ok) throw new Error(data.error);

                loadingState.classList.add('hidden');

                if (!data.grades || data.grades.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                // Render Grades
                let totalScore = 0;
                let totalMax = 0;

                // Sort by updated_at descending
                const sortedGrades = data.grades.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

                gradesList.innerHTML = sortedGrades.map(grade => {
                    const assignment = grade.assignments;
                    const score = grade.score_final;
                    const max = grade.score_max || 20; // Default to 20 if not set
                    
                    // Calc for average
                    if (score !== null && score !== undefined) {
                        // Normalize to /20 for average calculation
                        totalScore += (score / max) * 20;
                        totalMax += 20;
                    }

                    // Get Subject Translation
                    const subjId = assignment.subject;
                    let displaySubject = subjId;
                    if (subjId && window.subjects) {
                        const sObj = window.subjects.find(s => s.id === subjId);
                        if (sObj) displaySubject = sObj.fr; // Fallback to fr for now
                    }

                    // Date formatting
                    const date = new Date(grade.updated_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });

                    // Color coding
                    const percentage = (score / max) * 100;
                    let colorClass = 'text-gray-800';
                    let bgClass = 'bg-gray-100';
                    if (percentage >= 50) {
                        colorClass = 'text-emerald-700';
                        bgClass = 'bg-emerald-100';
                    } else if (percentage < 50 && score !== null) {
                        colorClass = 'text-red-600';
                        bgClass = 'bg-red-100';
                    }

                    const scoreDisplay = score !== null ? `<span class="text-xl font-bold ${colorClass}">${score}</span><span class="text-sm text-gray-500">/${max}</span>` : '<span class="text-sm text-gray-500 italic">Non noté</span>';

                    return `
                        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between grade-card">
                            <div class="flex-1 min-w-0 pr-4">
                                ${displaySubject ? `<span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-purple-50 text-purple-600 uppercase tracking-wide mb-1">${displaySubject}</span>` : ''}
                                <h3 class="font-bold text-gray-800 truncate">${assignment.name}</h3>
                                <p class="text-xs text-gray-400 mt-1">${date} ${assignment.trimester ? `• Trimestre ${assignment.trimester}` : ''}</p>
                            </div>
                            <div class="text-right ${bgClass} px-3 py-2 rounded-xl min-w-[70px] flex flex-col items-center justify-center">
                                ${scoreDisplay}
                            </div>
                        </div>
                    `;
                }).join('');

                // Update Average
                if (totalMax > 0) {
                    const avg = (totalScore / (totalMax / 20)).toFixed(2);
                    avgDisplay.textContent = `${avg}/20`;
                    if (avg >= 10) avgDisplay.className = 'text-2xl font-bold text-emerald-600';
                    else avgDisplay.className = 'text-2xl font-bold text-red-500';
                }

            } catch (err) {
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
                console.error(err);
            }
        }
    </script>
</body>
</html>
